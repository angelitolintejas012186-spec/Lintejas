<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex" />
  <title>Page not found — Lintejas Engine</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center; flex-direction: column;
      background: #0A1628; color: #F3EFE4; text-align: center;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      -webkit-font-smoothing: antialiased;
    }
    /* Brand lockup — LINTEJAS over ENGINE (matches the site header) */
    .lockup { margin-bottom: 2.5rem; line-height: 1; }
    .lockup .l1 {
      position: relative; overflow: hidden; display: inline-block;
      font-weight: 600; font-size: 1.35rem; letter-spacing: 0.2em; color: #F3EFE4;
    }
    .lockup .l1 .g { color: #D4A843; }
    .lockup .l1::after {
      content: ""; position: absolute; top: 0; left: -80%; width: 60%; height: 100%;
      background: linear-gradient(105deg, transparent, rgba(217,169,60,.16), transparent);
      animation: sheen 3.4s ease-in-out infinite; pointer-events: none;
    }
    .lockup .l2 {
      display: block; margin-top: 7px; font-weight: 600; font-size: 12px;
      letter-spacing: 0.5em; color: #D4A843; padding-left: 0.5em; /* optical centering for tracking */
    }
    @keyframes sheen { 0%,55%,100% { transform: translateX(0); } 25% { transform: translateX(333.33%); } }
    .wrap { max-width: 32rem; }
    .code {
      font-weight: 700; line-height: 1; letter-spacing: -0.02em;
      font-size: clamp(5rem, 18vw, 10rem); margin: 0 0 1.25rem;
      background: linear-gradient(135deg, #E8C766 0%, #D4A843 55%, #9A7A2E 100%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
    }
    h1 { font-size: clamp(1.4rem, 5vw, 2rem); font-weight: 600; margin: 0 0 0.75rem; color: #F3EFE4; }
    p  { font-size: 0.95rem; line-height: 1.6; margin: 0 0 2rem; color: #94A2B4; }
    a.btn {
      display: inline-block; text-decoration: none; font-weight: 600; font-size: 0.9rem;
      color: #0A1628; padding: 0.85rem 1.6rem; border-radius: 0.75rem;
      background: linear-gradient(135deg, #E8C766 0%, #D4A843 55%, #9A7A2E 100%);
      box-shadow: 0 0 24px rgba(212,168,67,0.28);
    }
    @media (prefers-reduced-motion: reduce) { .lockup .l1::after { animation: none; } }
  </style>
</head>
<body>
  <div class="lockup">
    <span class="l1"><span class="g">L</span>INTEJAS</span>
    <span class="l2">ENGINE</span>
  </div>
  <main class="wrap">
    <p class="code" aria-hidden="true">404</p>
    <h1>This page doesn’t exist</h1>
    <p>The link may be broken or the page may have moved.</p>
    <a class="btn" href="/">Back to home</a>
  </main>
</body>
</html>
