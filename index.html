<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Favicon (item 121): base is '/', served at lintejas.io root — no /Lintejas/ prefix -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lintejas Engine — Software Development &amp; Services, Philippines</title>
    <meta name="description" content="A. Lintejas Software Development &amp; Services — a DTI-registered software company in the Philippines building digital tools for Filipino entrepreneurs: NegosyoPlans, Matthew System, ZAM Academy and more." />
    <link rel="canonical" href="https://lintejas.io/" />
    <!-- Open Graph / social -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Lintejas Engine" />
    <meta property="og:title" content="Lintejas Engine — Software Development &amp; Services, Philippines" />
    <meta property="og:description" content="DTI-registered software company in the Philippines building digital tools for Filipino entrepreneurs — NegosyoPlans, Matthew System, and more." />
    <meta property="og:url" content="https://lintejas.io/" />
    <meta property="og:image" content="https://lintejas.io/favicon-180.png" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Lintejas Engine — Software Development &amp; Services, Philippines" />
    <meta name="twitter:description" content="DTI-registered software company in the Philippines building precision software ventures." />
    <meta name="twitter:image" content="https://lintejas.io/favicon-180.png" />
    <!-- Structured data (B4): Organization + WebSite. No postal address and no sameAs yet
         (the permanent Facebook page URL is pending — see the NegosyoPlans note). Email
         matches the address shown on the Contact page + footer. -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@graph": [
        {
          "@type": "Organization",
          "name": "Lintejas Engine",
          "legalName": "A. Lintejas Software Development & Services",
          "url": "https://lintejas.io/",
          "logo": "https://lintejas.io/favicon-180.png",
          "email": "hello@lintejas.com"
        },
        {
          "@type": "WebSite",
          "name": "Lintejas Engine",
          "url": "https://lintejas.io/"
        }
      ]
    }
    </script>
    <!-- Apply stored theme CSS vars synchronously before React loads to prevent colour flash -->
    <script>
      (function () {
        try {
          var c = JSON.parse(localStorage.getItem('lintejas_config') || 'null');
          if (c && c.theme && c.theme.vars) {
            var r = document.documentElement, v = c.theme.vars;
            for (var k in v) {
              if (Object.prototype.hasOwnProperty.call(v, k)) r.style.setProperty(k, v[k]);
            }
          }
        } catch (e) {}
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,700;1,9..144,400&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
